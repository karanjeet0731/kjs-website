<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KJS Creative — Blog</title><meta name="description" content="Insights, ideas and creative resources from KJS Creative"><style>
:root{--ink:#0d0d0d;--muted:#777;--line:#e8e7e3;--accent:#e0452a;--paper:#fff;--soft:#f6f5f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1180px;margin:auto;padding:0 28px}.nav{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;letter-spacing:.08em}.nav a{font-size:14px;color:#555}.hero{padding:78px 0 55px;border-bottom:1px solid var(--line)}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-size:12px;font-weight:700}.hero h1{font-size:clamp(48px,8vw,100px);line-height:.92;letter-spacing:-.06em;margin:16px 0}.hero p{max-width:560px;color:var(--muted);font-size:18px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:48px 0 90px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 50px #0000000d}.thumb{aspect-ratio:16/10;background:var(--soft);overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:22px}.meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.card h2{font-size:25px;line-height:1.05;letter-spacing:-.03em;margin:10px 0}.card p{color:var(--muted);line-height:1.6}.empty{padding:80px 0;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);padding:30px 0;color:#777;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{padding-top:55px}}
</style></head><body><header class="nav wrap"><a class="logo" href="/">KJS CREATIVE</a><a href="/">Back to website ↗</a></header><main><section class="hero wrap"><div class="eyebrow">KJS Creative Journal</div><h1>Ideas that<br>make brands move.</h1><p>Creative insights, design thinking, branding lessons and practical ideas from KJS Creative.</p></section><section class="wrap"><div id="grid" class="grid"><div class="empty">Loading articles…</div></div></section></main><footer><div class="wrap">© KJS Creative</div></footer><script>
const URL='https://psxyqzgezjfzuawdyzmp.supabase.co',KEY='sb_publishable_Iw7QyPNmZkVPpELo_LMDmA_lcFbUq3s';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
(async()=>{const el=document.querySelector('#grid');try{const r=await fetch(URL+'/rest/v1/blog_posts?select=id,title,slug,excerpt,featured_image_url,category,reading_time,published_at&status=eq.published&order=published_at.desc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});const posts=await r.json();if(!Array.isArray(posts)||!posts.length){el.innerHTML='<div class="empty">No articles published yet.</div>';return}el.innerHTML=posts.map(p=>'<a class="card" href="/blog/post.html?slug='+encodeURIComponent(p.slug)+'"><div class="thumb">'+(p.featured_image_url?'<img src="'+esc(p.featured_image_url)+'" alt="'+esc(p.title)+'">':'')+'</div><div class="body"><div class="meta">'+esc(p.category||'KJS Creative')+' · '+esc(p.reading_time||5)+' min read</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt||'Read the latest from KJS Creative.')+'</p></div></a>').join('')}catch(e){el.innerHTML='<div class="empty">Unable to load articles right now.</div>'}})();
</script></body></html>
