<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Prompt Generator | KJS Creative</title><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#101010;font:16px Archivo,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:28px 24px 80px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e5e1;padding:14px 0 22px}.logo{font-weight:800;letter-spacing:.04em}.logo span{color:#ff3c1f}.back{font-size:14px;color:#666}.eyebrow{margin-top:58px;color:#888;font-size:12px;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,76px);letter-spacing:-.055em;line-height:.98;margin:14px 0}.hero p{color:#777;max-width:650px;line-height:1.7}.panel{margin-top:34px;background:white;border:1px solid #e9e9e5;border-radius:18px;padding:clamp(20px,4vw,36px);box-shadow:0 12px 40px #00000008}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input,select,textarea{width:100%;border:1px solid #deded9;border-radius:9px;padding:13px 14px;font:inherit;background:#fff;min-width:0}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:9px;background:#101010;color:white;padding:14px 20px;font:700 14px Archivo;cursor:pointer}.btn:hover{background:#ff3c1f}.result{white-space:pre-wrap;line-height:1.7;background:#fafaf8;border:1px solid #e9e9e5;border-radius:12px;padding:18px;margin-top:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.muted{color:#888;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{padding:18px 16px 56px}.eyebrow{margin-top:40px}}
</style></head><body><main class="wrap"><header class="top"><a class="logo" href="index.html">KJS <span>CREATIVE</span></a><a class="back" href="index.html">← All tools</a></header><div class="hero"><div class="eyebrow">KJS Creative Toolkit / AI Video</div><h1>AI Video Prompt<br><span style="color:#ff3c1f">Generator.</span></h1><p>Build detailed, production-ready prompts for text-to-video and image-to-video workflows.</p></div><section class="panel"><div class="grid"><div class="field full"><label for="idea">Video idea / scene</label><textarea id="idea" placeholder="e.g. A premium perfume bottle on reflective black marble"></textarea></div><div class="field"><label for="model">Video model</label><select id="model"><option>Veo</option><option>Kling</option><option>Seedance</option><option>Runway</option><option>Generic text-to-video</option></select></div><div class="field"><label for="ratio">Aspect ratio</label><select id="ratio"><option>9:16 vertical</option><option>16:9 landscape</option><option>1:1 square</option><option>4:5 portrait</option></select></div><div class="field"><label for="style">Visual style</label><select id="style"><option>Photorealistic commercial</option><option>Cinematic</option><option>Minimal luxury</option><option>Documentary realism</option><option>3D animation</option><option>Surreal fantasy</option></select></div><div class="field"><label for="camera">Camera movement</label><select id="camera"><option>Slow dolly-in</option><option>Orbit shot</option><option>Static locked shot</option><option>Tracking shot</option><option>Crane / aerial movement</option><option>Handheld natural movement</option></select></div><div class="field"><label for="light">Lighting</label><select id="light"><option>Soft studio lighting</option><option>Golden hour</option><option>Dramatic low-key lighting</option><option>Natural window light</option><option>Neon cinematic lighting</option></select></div><div class="field"><label for="duration">Duration</label><select id="duration"><option>5 seconds</option><option>8 seconds</option><option>10 seconds</option><option>15 seconds</option></select></div><div class="field full"><button class="btn" onclick="generate()">Build video prompt ↗</button></div></div><div id="output" hidden><h3>Your prompt</h3><div class="result" id="prompt"></div><div class="actions"><button class="btn" onclick="copyPrompt()">Copy prompt</button></div></div><p class="muted">This creates structured prompts, not video files. Supported controls vary by model.</p></section></main><script>
function generate(){const idea=document.getElementById('idea').value.trim();if(!idea){alert('Describe your video idea first.');return}const v=[idea+'.','Create a '+document.getElementById('duration').value+' '+document.getElementById('style').value.toLowerCase()+' video for '+document.getElementById('model').value+'.','Camera: '+document.getElementById('camera').value+'. Lighting: '+document.getElementById('light').value+'.','Composition: clear subject separation, intentional framing, realistic textures, natural motion, coherent physics and polished production design.','Maintain consistent subject appearance, materials, proportions and environment throughout the shot.','Format: '+document.getElementById('ratio').value+'.','Avoid: flicker, jitter, warped geometry, extra limbs or objects, unreadable text, sudden cuts, inconsistent details and watermark artifacts.'];document.getElementById('prompt').textContent=v.join('\n\n');document.getElementById('output').hidden=false}function copyPrompt(){navigator.clipboard.writeText(document.getElementById('prompt').textContent).then(()=>alert('Prompt copied!')).catch(()=>alert('Clipboard unavailable in this browser.'))}
</script></body></html>
