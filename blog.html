<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KJS Creative — Blog</title><meta name="description" content="Design, branding, AI and creative insights from KJS Creative"><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#111;font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:32px 24px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:90px}.logo{font-weight:800;letter-spacing:.08em}.back{font-size:14px}.hero{max-width:760px;margin-bottom:55px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;color:#777;font-size:12px}.hero h1{font-size:clamp(48px,8vw,100px);line-height:.9;letter-spacing:-.06em;margin:14px 0}.hero p{font-size:18px;color:#666;max-width:600px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid #e5e3dc;border-radius:16px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 14px 35px #1111}.thumb{height:220px;background:#e9e7e0;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.copy{padding:22px}.meta{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:.08em}.card h2{font-size:24px;line-height:1.05;margin:10px 0}.excerpt{color:#666;font-size:14px;line-height:1.6}.article{max-width:820px;margin:auto}.article h1{font-size:clamp(42px,7vw,82px);line-height:.95;letter-spacing:-.05em}.article-meta{color:#777;margin:18px 0 40px}.content{font-size:18px;line-height:1.75}.content img{max-width:100%;border-radius:12px}.empty{text-align:center;color:#777;padding:80px}.hide{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.nav{margin-bottom:55px}}</style></head><body><div class="wrap"><nav class="nav"><a class="logo" href="index.html">KJS CREATIVE</a><a class="back" href="index.html">← Back to website</a></nav><main id="list"><section class="hero"><div class="eyebrow">KJS Creative Journal</div><h1>Ideas worth sharing.</h1><p>Design, branding, AI and creative insights from the KJS Creative team.</p></section><div id="posts" class="grid"><div class="empty">Loading posts…</div></div></main><article id="article" class="article hide"></article></div><script>const URL='https://psxyqzgezjfzuawdyzmp.supabase.co/rest/v1/blog_posts';const KEY='sb_publishable_Iw7QyPNmZkVPpELo_LMDmA_lcFbUq3s';const qs=new URLSearchParams(location.search);const slug=qs.get('post');async function get(){const headers={apikey:KEY,Authorization:'Bearer '+KEY};if(slug){const r=await fetch(URL+'?select=*&slug=eq.'+encodeURIComponent(slug)+'&status=eq.published&limit=1',{headers});const d=await r.json();if(d[0])showArticle(d[0]);else showEmpty();return}const r=await fetch(URL+'?select=*&status=eq.published&order=published_at.desc',{headers});const d=await r.json();showList(d)}function showList(posts){const el=document.getElementById('posts');if(!posts.length){el.innerHTML='<div class="empty">No published posts yet.</div>';return}el.innerHTML=posts.map(p=>'<a class="card" href="blog.html?post='+encodeURIComponent(p.slug)+'"><div class="thumb">'+(p.featured_image_url?'<img src="'+p.featured_image_url+'" alt="">':'KJS CREATIVE')+'</div><div class="copy"><div class="meta">'+(p.category||'Journal')+' · '+(p.reading_time||5)+' min read</div><h2>'+esc(p.title)+'</h2><p class="excerpt">'+esc(p.excerpt||'Read the latest from KJS Creative.')+'</p></div></a>').join('')}function showArticle(p){document.getElementById('list').classList.add('hide');const a=document.getElementById('article');a.classList.remove('hide');a.innerHTML='<div class="eyebrow">'+esc(p.category||'Journal')+'</div><h1>'+esc(p.title)+'</h1><div class="article-meta">'+new Date(p.published_at||p.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})+' · '+(p.reading_time||5)+' min read</div>'+(p.featured_image_url?'<img style="width:100%;border-radius:16px;margin-bottom:35px" src="'+p.featured_image_url+'" alt="">':'')+'<div class="content">'+p.content_html+'</div><p style="margin-top:55px"><a href="blog.html">← All articles</a></p>'}function showEmpty(){document.getElementById('list').innerHTML='<div class="empty">Article not found.</div>'}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}get().catch(()=>showEmpty())</script></body></html>
