<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KJS Creative — Article</title><meta name="description" content=""><style>:root{--ink:#0d0d0d;--muted:#777;--line:#e8e7e3;--accent:#e0452a}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:900px;margin:auto;padding:0 28px}.nav{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;letter-spacing:.08em}.nav a{font-size:14px}.article{padding:70px 0 100px}.meta{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-weight:700}.article h1{font-size:clamp(44px,7vw,78px);line-height:.95;letter-spacing:-.055em;margin:16px 0 22px}.excerpt{font-size:20px;line-height:1.65;color:var(--muted);margin-bottom:35px}.hero{width:100%;max-height:520px;object-fit:cover;border-radius:14px;margin-bottom:50px}.content{font-size:18px;line-height:1.8}.content h2{font-size:32px;line-height:1.1;margin-top:45px}.content img{max-width:100%;border-radius:10px}.back{display:inline-block;margin-bottom:40px;color:#555}.error{text-align:center;padding:100px 0;color:#777}</style></head><body><header class="nav wrap"><a class="logo" href="/">KJS CREATIVE</a><a href="/blog/">All articles ↗</a></header><main id="app" class="wrap"><div class="error">Loading article…</div></main><script>
const URL='https://psxyqzgezjfzuawdyzmp.supabase.co',KEY='sb_publishable_Iw7QyPNmZkVPpELo_LMDmA_lcFbUq3s';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const slug=new URLSearchParams(location.search).get('slug');
(async()=>{const el=document.querySelector('#app');if(!slug){el.innerHTML='<div class="error">Article not found.</div>';return}try{const r=await fetch(URL+'/rest/v1/blog_posts?select=*&slug=eq.'+encodeURIComponent(slug)+'&status=eq.published&limit=1',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});const a=await r.json();const p=a[0];if(!p){el.innerHTML='<div class="error">Article not found.</div>';return}document.title=esc(p.seo_title||p.title)+' — KJS Creative';document.querySelector('meta[name=description]').content=p.meta_description||p.excerpt||'';el.innerHTML='<article class="article"><a class="back" href="/blog/">← Back to articles</a><div class="meta">'+esc(p.category||'KJS Creative')+' · '+esc(p.reading_time||5)+' min read</div><h1>'+esc(p.title)+'</h1><p class="excerpt">'+esc(p.excerpt||'')+'</p>'+(p.featured_image_url?'<img class="hero" src="'+esc(p.featured_image_url)+'" alt="'+esc(p.title)+'">':'')+'<div class="content">'+p.content_html+'</div></article>'}catch(e){el.innerHTML='<div class="error">Unable to load this article right now.</div>'}})();
</script></body></html>
