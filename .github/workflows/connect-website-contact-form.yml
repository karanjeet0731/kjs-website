name: Connect website contact form to CRM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-website-contact-form.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch contact form tracking
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = """  fetch(crmLeadEndpoint, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      fullname: fname,
      email: email,
      service: document.getElementById('service').value,
      message: message
    })
  }).then(r => { if (!r.ok) throw new Error('CRM submission failed'); });"""
          new = """  const crmParams = new URLSearchParams(window.location.search);
  fetch(crmLeadEndpoint, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      fullname: fname,
      email: email,
      phone: document.getElementById('phone')?.value || '',
      service: document.getElementById('service').value,
      message: message,
      source: crmParams.get('utm_source') || document.referrer || 'Website',
      page: window.location.href,
      utm_source: crmParams.get('utm_source') || '',
      utm_medium: crmParams.get('utm_medium') || '',
      utm_campaign: crmParams.get('utm_campaign') || '',
      utm_term: crmParams.get('utm_term') || '',
      utm_content: crmParams.get('utm_content') || ''
    })
  }).then(r => { if (!r.ok) throw new Error('CRM submission failed'); });"""
          if old not in s:
              raise SystemExit('Expected CRM fetch block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/connect-website-contact-form.yml
          git commit -m 'Track website lead source and UTM data' || exit 0
          git push
