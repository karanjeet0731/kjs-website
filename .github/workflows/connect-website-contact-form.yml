name: Connect website contact form to CRM

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-website-contact-form.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch contact form
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          endpoint = 'https://psxyqzgezjfzuawdyzmp.supabase.co/functions/v1/website-lead'
          old = "const contactForm = document.getElementById('contactForm');\nconst submitBtn = document.getElementById('submitBtn');"
          new = "const contactForm = document.getElementById('contactForm');\nconst submitBtn = document.getElementById('submitBtn');\nconst crmLeadEndpoint = '" + endpoint + "';"
          if 'const crmLeadEndpoint' not in s:
              s = s.replace(old, new, 1)
          marker = "  // Send form data to Formspree\n  fetch(contactForm.action, {"
          replacement = "  // Send the same enquiry to the KJS CRM first.\n  fetch(crmLeadEndpoint, {\n    method: 'POST',\n    headers: {'Content-Type': 'application/json'},\n    body: JSON.stringify({\n      fullname: fname,\n      email: email,\n      service: document.getElementById('service').value,\n      message: message\n    })\n  }).then(r => { if (!r.ok) throw new Error('CRM submission failed'); });\n\n  // Send form data to Formspree\n  fetch(contactForm.action, {"
          if 'fetch(crmLeadEndpoint' not in s:
              s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/connect-website-contact-form.yml
          git commit -m 'Connect contact form to CRM' || exit 0
          git push
