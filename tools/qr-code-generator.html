<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator | KJS Creative</title><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#101010;font:16px Archivo,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:28px 24px 80px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e5e1;padding:14px 0 22px}.logo{font-weight:800;letter-spacing:.04em}.logo span{color:#ff3c1f}.back{font-size:14px;color:#666}.eyebrow{margin-top:58px;color:#888;font-size:12px;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,76px);letter-spacing:-.055em;line-height:.98;margin:14px 0}.hero p{color:#777;max-width:650px;line-height:1.7}.panel{margin-top:34px;background:white;border:1px solid #e9e9e5;border-radius:18px;padding:clamp(20px,4vw,36px);box-shadow:0 12px 40px #00000008}.layout{display:grid;grid-template-columns:1fr 280px;gap:28px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}label{font-size:13px;font-weight:700}input,select{width:100%;border:1px solid #deded9;border-radius:9px;padding:13px 14px;font:inherit;background:#fff;min-width:0}.btn{border:0;border-radius:9px;background:#101010;color:white;padding:14px 20px;font:700 14px Archivo;cursor:pointer}.btn:hover{background:#ff3c1f}.preview{border:1px solid #eee;border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px}.preview canvas,.preview img{max-width:100%;height:auto}.muted{color:#888;font-size:13px}@media(max-width:650px){.layout{grid-template-columns:1fr}.wrap{padding:18px 16px 56px}.eyebrow{margin-top:40px}}
</style></head><body><main class="wrap"><header class="top"><a class="logo" href="index.html">KJS <span>CREATIVE</span></a><a class="back" href="index.html">← All tools</a></header><div class="hero"><div class="eyebrow">KJS Creative Toolkit / Utilities</div><h1>QR Code<br><span style="color:#ff3c1f">Generator.</span></h1><p>Create downloadable QR codes for websites, contact links, WhatsApp, menus and campaigns.</p></div><section class="panel"><div class="layout"><div><div class="field"><label for="data">Website URL or text</label><input id="data" type="text" value="https://kjscreative.in" placeholder="https://example.com"></div><div class="field"><label for="size">QR size</label><select id="size"><option value="180">180 × 180</option><option value="256" selected>256 × 256</option><option value="400">400 × 400</option><option value="600">600 × 600</option></select></div><div class="field"><label for="dark">QR colour</label><input id="dark" type="color" value="#101010"></div><div class="field"><label for="light">Background colour</label><input id="light" type="color" value="#ffffff"></div><button class="btn" onclick="makeQR()">Generate QR code ↗</button><p class="muted">QR rendering uses a browser library loaded from CDN.</p></div><div class="preview"><div id="qr"></div><p id="hint" class="muted">Your QR code will appear here.</p><button id="download" class="btn" style="margin-top:14px" hidden onclick="downloadQR()">Download PNG ↓</button></div></div></section></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
function makeQR(){const value=document.getElementById('data').value.trim();if(!value){alert('Enter a URL or text first.');return}if(!window.QRCode){alert('QR library could not load. Check your connection and retry.');return}const box=document.getElementById('qr');box.innerHTML='';const size=+document.getElementById('size').value;new QRCode(box,{text:value,width:size,height:size,colorDark:document.getElementById('dark').value,colorLight:document.getElementById('light').value,correctLevel:QRCode.CorrectLevel.H});document.getElementById('hint').hidden=true;document.getElementById('download').hidden=false}
function downloadQR(){const box=document.getElementById('qr'),canvas=box.querySelector('canvas'),img=box.querySelector('img'),src=canvas?canvas.toDataURL('image/png'):img?.src;if(!src){alert('Generate a QR code first.');return}const a=document.createElement('a');a.href=src;a.download='kjs-qr-code.png';a.click()}makeQR();
</script></body></html>
